<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Socio · SocioClub</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragmentos/layout :: encabezado}"></header>

<main>
    <section class="panel formulario-panel">
        <h2 th:text="${titulo}">Nuevo socio</h2>

        <form th:action="@{${accion}}" th:object="${socio}" method="post">
            <div class="campo"><label>DNI<input th:field="*{dni}" required inputmode="numeric" maxlength="8" placeholder="Sin puntos"></label><small class="error" th:errors="*{dni}"></small></div>
            <div class="campo"><label>Nombre<input th:field="*{nombre}" required maxlength="100"></label><small class="error" th:errors="*{nombre}"></small></div>
            <div class="campo"><label>Apellido<input th:field="*{apellido}" required maxlength="100"></label><small class="error" th:errors="*{apellido}"></small></div>
            <div class="campo"><label>Fecha de nacimiento<input th:field="*{fechaNacimiento}" type="date" required></label><small class="error" th:errors="*{fechaNacimiento}"></small></div>
            <div class="campo"><label>Email<input th:field="*{email}" type="email" maxlength="150"></label><small class="error" th:errors="*{email}"></small></div>
            <div class="campo"><label>Teléfono<input th:field="*{telefono}" maxlength="30"></label><small class="error" th:errors="*{telefono}"></small></div>
            <div class="campo">
                <label>Estado de cuota
                    <select th:field="*{estadoCuota}">
                        <option th:each="estado : ${estadosCuota}" th:value="${estado}" th:text="${estado}">AL_DIA</option>
                    </select>
                </label>
                <small class="error" th:errors="*{estadoCuota}"></small>
            </div>

            <div class="acciones-formulario">
                <a th:href="@{/socios}">Cancelar</a>
                <button type="submit">Guardar socio</button>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragmentos/layout :: pie}"></footer>

</body>
</html>
