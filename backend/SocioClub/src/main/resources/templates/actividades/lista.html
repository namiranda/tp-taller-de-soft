<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actividades · SocioClub</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:replace="~{fragmentos/layout :: encabezado}"></header>

<main>
    <section class="panel">
        <h2>Actividades</h2>

        <p class="alerta alerta-exito" th:if="${mensaje}" th:text="${mensaje}">Actividad eliminada correctamente</p>
        <p class="alerta alerta-error" th:if="${error}" th:text="${error}">Mensaje de error</p>

        <p th:if="${#lists.isEmpty(actividades)}">No hay actividades cargadas.</p>

        <div class="contenedor-tabla" th:unless="${#lists.isEmpty(actividades)}">
            <table>
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Disciplina</th>
                    <th>Profesor/a</th>
                    <th>Días</th>
                    <th>Horario</th>
                    <th>Edades</th>
                    <th>Cupo</th>
                    <th>Cuota mensual</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="actividad : ${actividades}">
                    <td class="nombre" th:text="${actividad.nombre}">Fútbol infantil</td>
                    <td th:text="${actividad.disciplina}">Fútbol</td>
                    <td th:text="${actividad.profesor}">Diego Ferreyra</td>
                    <td th:text="${actividad.dias}">Lun y Mié</td>
                    <td th:text="${#temporals.format(actividad.horario, 'HH:mm')}">18:00</td>
                    <td th:text="|${actividad.edadMinima} a ${actividad.edadMaxima}|">6 a 12</td>
                    <td th:text="${actividad.cupoMaximo}">40</td>
                    <td class="cuota" th:text="|$${#numbers.formatDecimal(actividad.cuotaMensual, 1, 'POINT', 0, 'COMMA')}|">$ 18.000</td>
                    <td class="acciones">
                        <form class="formulario-baja" method="post"
                              th:action="@{/actividades/{id}/eliminar(id=${actividad.id})}"
                              onsubmit="return confirm('¿Seguro que querés eliminar esta actividad?')">
                            <button class="boton boton-peligro" type="submit">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragmentos/layout :: pie}"></footer>

</body>
</html>
