spring.application.name=SocioClub

# Conexion a MySQL (base compartida del equipo en Aiven)
spring.datasource.url=jdbc:mysql://socioclub-socioclub.a.aivencloud.com:24898/socioclub?sslMode=REQUIRED
spring.datasource.username=equipo_socioclub
spring.datasource.password=${DB_PASSWORD}

# Las tablas ya existen en la base compartida: Hibernate no las crea ni las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
