spring.application.name=SocioClub

# Configure DB_URL, DB_USERNAME and DB_PASSWORD for the local or shared MySQL server.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/socioclub?sslMode=DISABLED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create missing tables and load the idempotent initial dataset from schema.sql/data.sql.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
